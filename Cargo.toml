[package]
name = "brz-redis"
version = "0.0.7"
edition = "2024"
description = "Asynchronous Redis client with multiplexed connections and client-side sharding"
license = "MIT OR Apache-2.0"
repository = "https://github.com/we-breeze/redis"

[dependencies]
tokio = { version = "1", features = ["net", "rt", "sync", "time", "io-util", "macros"] }
bytes = "1"
futures-util = "0.3"
tracing = "0.1"
itoa = "1"
ryu = "1"
md5 = "0.7"
rand = "0.8"
memchr = "2"
log = "0.4"
enum_dispatch = "0.3"
brz-net = { package = "brz-net",   version = "0.0.2"}
arc-swap = "1"
brz-metrics = { package = "brz-metrics",   optional = true, version = "0.0.3"}

[dev-dependencies]
tokio = { version = "1", features = ["full"] }

[features]
default = []
# Emit ProfileUtil-compatible endpoint metrics for completed direct Redis
# attempts. The feature remains opt-in so the SDK has no metrics dependency
# unless the embedding application explicitly selects this output contract.
metrics = ["dep:brz-metrics"]
# Integration tests that require a live redis-server are gated behind this.
integration-tests = []

# Deployment-specific benchmark tooling has its own workspace.
[workspace]
members = []
exclude = ["tools/redis-bench"]
resolver = "2"

[lib]
name = "brz_redis"
