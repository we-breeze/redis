[package]
name = "redis"
version = "0.1.0"
edition = "2024"
description = "High-performance, high-availability async Redis client for the example breeze platform"
license = "MIT"

[dependencies]
tokio = { version = "1", features = ["net", "rt", "sync", "time", "io-util", "macros"] }
bytes = "1"
futures-util = "0.3"
tracing = "0.1"
itoa = "1"
ryu = "1"
md5 = "0.7"
rand = "0.8"
memchr = "2"
log = "0.4"
enum_dispatch = "0.3"
brz-discovery = { workspace = true }
brz-net = { package = "net", path = "../net" }
arc-swap = "1"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
tempfile = { workspace = true }

[features]
default = []
# Integration tests that require a live redis-server are gated behind this.
integration-tests = []

# This crate is itself the SDK (`redis`) AND the workspace root. The
# `redis-bench` load-test harness lives under `tools/redis-bench` and is the
# only other member.
[workspace]
members = ["tools/redis-bench"]
resolver = "2"

[workspace.dependencies]
# Shared Breeze checkout managed by the consuming repository.
brz-discovery = { package = "discovery", path = "../discovery" }
tempfile = "3"
# Shared sibling crate: the bench harness installs this allocator at its binary
# composition root to get mimalloc + per-request allocation accounting. The SDK
# itself stays allocator-agnostic.
brz-mem = { path = "../memory", version = "0.1.0", default-features = false }
